blueprint:
  name: Amazon Remote — ESPHome Buttons
  description: >-
    Assign actions to the buttons on the remote connected through ESPHome.
    Select the “Last Button” entity. All actions are optional.
    App buttons depend on the model; app_4 does not assume a particular brand.
    Actions receive the variables button (up, voice, etc.) and button_event
    (press or release). The general release action also runs when Voice is released.
    Native Assist already handles voice actions; leave the Voice press and release
    actions empty when using Assist.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    remote:
      name: Last Button
      description: The “Last Button” sensor entity from the ESPHome bridge.
      selector:
        entity:
          filter:
            - domain: sensor
              integration: esphome
    up:
      name: Up
      default: []
      selector:
        action: {}
    down:
      name: Down
      default: []
      selector:
        action: {}
    left:
      name: Left
      default: []
      selector:
        action: {}
    right:
      name: Right
      default: []
      selector:
        action: {}
    select:
      name: Select
      default: []
      selector:
        action: {}
    back:
      name: Back
      default: []
      selector:
        action: {}
    home:
      name: Home
      default: []
      selector:
        action: {}
    menu:
      name: Menu
      default: []
      selector:
        action: {}
    voice:
      name: Voice — press
      default: []
      selector:
        action: {}
    voice_release:
      name: Voice — release
      default: []
      selector:
        action: {}
    play_pause:
      name: Play / pause
      default: []
      selector:
        action: {}
    rewind:
      name: Rewind
      default: []
      selector:
        action: {}
    fast_forward:
      name: Fast forward
      default: []
      selector:
        action: {}
    volume_up:
      name: Volume up
      default: []
      selector:
        action: {}
    volume_down:
      name: Volume down
      default: []
      selector:
        action: {}
    mute:
      name: Mute
      default: []
      selector:
        action: {}
    power:
      name: Power
      default: []
      selector:
        action: {}
    tv:
      name: TV
      default: []
      selector:
        action: {}
    prime_video:
      name: Prime Video
      default: []
      selector:
        action: {}
    netflix:
      name: Netflix
      default: []
      selector:
        action: {}
    disney_plus:
      name: Disney+
      default: []
      selector:
        action: {}
    app_4:
      name: Fourth app
      default: []
      selector:
        action: {}
    release:
      name: Any button — release
      description: Use the button variable to identify which button was released.
      default: []
      selector:
        action: {}

triggers:
  - trigger: state
    entity_id: !input remote
    to: null

variables:
  button_state: "{{ trigger.to_state.state if trigger is defined and trigger.to_state is not none else '' }}"
  button: "{{ button_state.split(':', 1)[-1] }}"
  button_event: "{{ button_state.split(':', 1)[0] }}"

conditions:
  - condition: template
    value_template: "{{ button_event in ['press', 'release'] }}"

actions:
  - choose:
      - conditions: "{{ button_event == 'press' and button == 'up' }}"
        sequence: !input up
      - conditions: "{{ button_event == 'press' and button == 'down' }}"
        sequence: !input down
      - conditions: "{{ button_event == 'press' and button == 'left' }}"
        sequence: !input left
      - conditions: "{{ button_event == 'press' and button == 'right' }}"
        sequence: !input right
      - conditions: "{{ button_event == 'press' and button == 'select' }}"
        sequence: !input select
      - conditions: "{{ button_event == 'press' and button == 'back' }}"
        sequence: !input back
      - conditions: "{{ button_event == 'press' and button == 'home' }}"
        sequence: !input home
      - conditions: "{{ button_event == 'press' and button == 'menu' }}"
        sequence: !input menu
      - conditions: "{{ button_event == 'press' and button == 'voice' }}"
        sequence: !input voice
      - conditions: "{{ button_event == 'release' and button == 'voice' }}"
        sequence: !input voice_release
      - conditions: "{{ button_event == 'press' and button == 'play_pause' }}"
        sequence: !input play_pause
      - conditions: "{{ button_event == 'press' and button == 'rewind' }}"
        sequence: !input rewind
      - conditions: "{{ button_event == 'press' and button == 'fast_forward' }}"
        sequence: !input fast_forward
      - conditions: "{{ button_event == 'press' and button == 'volume_up' }}"
        sequence: !input volume_up
      - conditions: "{{ button_event == 'press' and button == 'volume_down' }}"
        sequence: !input volume_down
      - conditions: "{{ button_event == 'press' and button == 'mute' }}"
        sequence: !input mute
      - conditions: "{{ button_event == 'press' and button == 'power' }}"
        sequence: !input power
      - conditions: "{{ button_event == 'press' and button == 'tv' }}"
        sequence: !input tv
      - conditions: "{{ button_event == 'press' and button == 'prime_video' }}"
        sequence: !input prime_video
      - conditions: "{{ button_event == 'press' and button == 'netflix' }}"
        sequence: !input netflix
      - conditions: "{{ button_event == 'press' and button == 'disney_plus' }}"
        sequence: !input disney_plus
      - conditions: "{{ button_event == 'press' and button == 'app_4' }}"
        sequence: !input app_4
  - choose:
      - conditions: "{{ button_event == 'release' }}"
        sequence: !input release

# Run releases even while a press action is waiting or playing media.
mode: parallel
