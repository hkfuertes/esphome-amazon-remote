substitutions:
  device_name: amazon-remote-bridge
  friendly_name: Amazon Remote Bridge
  # Replace with your remote's Bluetooth MAC address (not the ESP32's).
  remote_mac: "AA:BB:CC:DD:EE:FF"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    esp32_ble: INFO

web_server:
  port: 80
  version: 3
  local: true
  log: true

external_components:
  - source: github://hkfuertes/esphome-amazon-remote@main
    components: [amazon_remote]

# Unencrypted native API: use only on a trusted LAN.
api: {}

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  power_save_mode: none
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Amazon Remote Rescue
    password: !secret fallback_ap_password
  on_connect:
    then:
      - ble.enable:
      - delay: 1s
      - lambda: |-
          // Match the timing used by atv-remote-hid-bridge.
          esp_bd_addr_t remote;
          esphome::ble_device_base::uint64_to_mac_msb_first(id(fire_remote).get_address(), remote);
          const auto err = esp_ble_gap_set_prefer_conn_params(remote, 12, 12, 4, 400);
          if (err != ESP_OK) {
            ESP_LOGW("amazon_remote", "Connection parameters rejected: %s", esp_err_to_name(err));
          }
      - esp32_ble_tracker.start_scan:
          continuous: true
      - logger.log: "Wi-Fi connected; BLE scan requested"
  on_disconnect:
    then:
      - esp32_ble_tracker.stop_scan:
      - ble.disable:

captive_portal:

# Wi-Fi authenticates before BLE starts sharing the radio.
esp32_ble:
  enable_on_boot: false
  io_capability: none
  auth_req_mode: bond

esp32_ble_tracker:
  scan_parameters:
    continuous: false

ble_client:
  - mac_address: ${remote_mac}
    id: fire_remote
    on_connect:
      then:
        - logger.log: "Amazon remote BLE link connected"
        - lambda: |-
            const auto err = id(fire_remote).pair();
            if (err != ESP_OK) {
              ESP_LOGW("amazon_remote", "Pair request failed: %s", esp_err_to_name(err));
            }
    on_disconnect:
      then:
        - logger.log: "Amazon remote BLE link disconnected"

button:
  - platform: restart
    name: Restart
    entity_category: config
  - platform: safe_mode
    name: Restart in Safe Mode
    entity_category: config
  - platform: template
    name: Connect Amazon Remote
    on_press:
      - ble_client.connect: fire_remote

binary_sensor:
  - platform: status
    name: Status

globals:
  - id: alexa_held
    type: bool
    restore_value: false
    initial_value: 'false'

audio:
  codecs:
    opus:
      state_memory: psram
      pseudostack:
        buffer_memory: psram

microphone:
  - platform: amazon_remote
    id: remote_mic
    remote_id: remote_buttons

# Safety ceiling if the release packet is lost; no continuous listening.
script:
  - id: assist_recording_limit
    mode: restart
    then:
      - delay: 30s
      - script.execute: assist_finish_recording
      - logger.log: "Assist recording limit reached (30s)"
  - id: assist_finish_recording
    mode: single
    then:
      # Stop the remote first; let queued PCM reach HA before sending end-of-audio.
      - lambda: id(remote_buttons).set_microphone_enabled(false);
      - delay: 100ms
      - lambda: |-
          auto *client = id(assist).get_api_connection();
          if (client == nullptr) return;
          esphome::api::VoiceAssistantAudio end;
          end.end = true;
          if (!client->send_message(end)) {
            ESP_LOGW("assist", "Failed to send end-of-audio");
            id(assist).request_stop();
            return;
          }
          // Follow the native VAD-end lifecycle, without the abort sent by request_stop().
          esphome::api::VoiceAssistantEventResponse event;
          event.event_type = esphome::api::enums::VOICE_ASSISTANT_STT_VAD_END;
          id(assist).on_event(event);
          id(assist_status).publish_state("processing");
          ESP_LOGI("assist", "Audio finished; waiting for transcription");

voice_assistant:
  id: assist
  microphone: remote_mic
  use_wake_word: false
  on_client_connected:
    - text_sensor.template.publish:
        id: assist_status
        state: connected
  on_client_disconnected:
    - script.stop: assist_finish_recording
    - microphone.stop_capture: remote_mic
    - voice_assistant.stop:
        id: assist
    - script.stop: assist_recording_limit
    - text_sensor.template.publish:
        id: assist_status
        state: disconnected
  on_listening:
    - text_sensor.template.publish:
        id: assist_status
        state: listening
    - logger.log: "Assist listening: speak while holding Alexa"
  on_stt_end:
    - lambda: |-
        id(assist_transcript).publish_state(x);
        ESP_LOGI("assist", "Recognized: %s", x.c_str());
    - text_sensor.template.publish:
        id: assist_status
        state: processing
  on_tts_start:
    - lambda: |-
        id(assist_response).publish_state(x);
        ESP_LOGI("assist", "Response: %s", x.c_str());
  on_tts_end:
    - if:
        condition:
          lambda: |-
            const auto &entity = id(assist_output_speaker).state;
            return entity.size() > 13 && entity.compare(0, 13, "media_player.") == 0 &&
                   entity.find_first_not_of("abcdefghijklmnopqrstuvwxyz0123456789_", 13) == std::string::npos;
        then:
          - homeassistant.action:
              action: media_player.play_media
              data:
                entity_id: !lambda return id(assist_output_speaker).state;
                media_content_id: !lambda return x;
                media_content_type: music
  on_end:
    - script.stop: assist_finish_recording
    - microphone.stop_capture: remote_mic
    - script.stop: assist_recording_limit
    - text_sensor.template.publish:
        id: assist_status
        state: idle
  on_error:
    - script.stop: assist_finish_recording
    - microphone.stop_capture: remote_mic
    - script.stop: assist_recording_limit
    - lambda: |-
        id(assist_status).publish_state("error:" + code);
        ESP_LOGW("assist", "%s: %s", code.c_str(), message.c_str());

# Optional HA media_player entity_id; empty keeps responses text-only.
text:
  - platform: template
    id: assist_output_speaker
    name: Assist Output Speaker
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    min_length: 0
    max_length: 100

text_sensor:
  - platform: template
    id: assist_status
    name: Assist Status
    update_interval: never
  - platform: template
    id: assist_transcript
    name: Assist Transcript
    update_interval: never
  - platform: template
    id: assist_response
    name: Assist Response
    update_interval: never
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: IP Address
    ssid:
      name: Connected SSID
    mac_address:
      name: Wi-Fi MAC
  - platform: amazon_remote
    id: remote_buttons
    ble_client_id: fire_remote
    name: Last Button
    on_value:
      - lambda: |-
          if (x == "press:voice") {
            if (id(alexa_held)) return;
            id(alexa_held) = true;
            if (id(assist).get_api_connection() == nullptr) {
              ESP_LOGW("assist", "Home Assistant has not connected to the Assist satellite");
              id(assist_status).publish_state("not_connected");
            } else if (!id(remote_mic).is_ready()) {
              ESP_LOGW("assist", "Remote microphone is not ready");
              id(assist_status).publish_state("microphone_not_ready");
            } else if (!id(assist).is_running_or_continuous()) {
              id(assist).request_start(false, false);
              id(assist_recording_limit).execute();
            }
          } else if (x == "release:voice") {
            if (!id(alexa_held)) return;
            id(alexa_held) = false;
            id(assist_recording_limit).stop();
            if (id(assist_status).state == "listening") {
              id(assist_finish_recording).execute();
            } else if (id(assist_status).state != "processing") {
              // Released before HA started listening: cancel the empty session.
              id(assist).request_stop();
            }
          } else if (x == "disconnected") {
            id(alexa_held) = false;
            id(assist_recording_limit).stop();
            id(assist_finish_recording).stop();
            id(assist).request_stop();
          }

sensor:
  - platform: uptime
    name: Uptime
    update_interval: 60s
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
